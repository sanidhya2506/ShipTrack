<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShipTrack - Shipment Analytics</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f8fafc;
        }

        .late {
            color: #dc2626;
            font-weight: bold;
        }

        .good {
            color: #16a34a;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>
</head>


<body>

    <header>

        <h1>ShipTrack</h1>

        <p>
            Shipment Analytics Dashboard
        </p>

    </header>


    <div class="container">


        <!-- Summary Cards -->

        <div class="cards">

            <div class="card">
                <h3>Total Orders</h3>
                <p id="totalOrders">-</p>
            </div>

            <div class="card">
                <h3>Delivered</h3>
                <p id="delivered">-</p>
            </div>

            <div class="card">
                <h3>Late Orders</h3>
                <p id="late">-</p>
            </div>

            <div class="card">
                <h3>Late Rate</h3>
                <p id="lateRate">-</p>
            </div>

        </div>


        <!-- Average Delivery -->

        <div class="section">

            <h2>Average Delivery Time</h2>

            <p style="font-size: 35px; font-weight: bold;">
                <span id="averageDelivery">-</span> days
            </p>

        </div>


        <!-- Warehouse -->

        <div class="section">

            <h2>Warehouse Performance</h2>

            <table>

                <thead>

                    <tr>
                        <th>Warehouse</th>
                        <th>Total Orders</th>
                        <th>Late Orders</th>
                    </tr>

                </thead>

                <tbody id="warehouseTable">

                </tbody>

            </table>

        </div>


        <!-- Carrier -->

        <div class="section">

            <h2>Carrier Performance</h2>

            <table>

                <thead>

                    <tr>
                        <th>Carrier</th>
                        <th>Total Orders</th>
                        <th>Late Orders</th>
                    </tr>

                </thead>

                <tbody id="carrierTable">

                </tbody>

            </table>

        </div>


    </div>


    <script>

        // Get overall metrics

        fetch("/api/metrics")

            .then(response => response.json())

            .then(data => {

                document.getElementById("totalOrders").textContent =
                    data.total_orders;

                document.getElementById("delivered").textContent =
                    data.delivered;

                document.getElementById("late").textContent =
                    data.late;

                document.getElementById("lateRate").textContent =
                    data.late_rate + "%";

                document.getElementById("averageDelivery").textContent =
                    data.average_delivery;

            });


        // Get warehouse data

        fetch("/api/warehouses")

            .then(response => response.json())

            .then(data => {

                const table =
                    document.getElementById("warehouseTable");

                data.forEach(item => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${item.warehouse}</td>
                        <td>${item.total_orders}</td>
                        <td class="late">${item.late_orders}</td>
                    `;

                    table.appendChild(row);

                });

            });


        // Get carrier data

        fetch("/api/carriers")

            .then(response => response.json())

            .then(data => {

                const table =
                    document.getElementById("carrierTable");

                data.forEach(item => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${item.carrier}</td>
                        <td>${item.total_orders}</td>
                        <td class="late">${item.late_orders}</td>
                    `;

                    table.appendChild(row);

                });

            });

    </script>

</body>

</html>
